name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: React Doctor
        run: npx react-doctor@0.9.4 --scope full --blocking warning
      - name: Build
        run: npm run build
      - name: Pack dry-run
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          if grep -E '(^|/)example/' /tmp/npm-pack.txt; then
            echo "::error::npm pack must not include example/"
            exit 1
          fi
          if grep -Ei '(\.env|credentials\.json|api[_-]?key|google.*maps.*AIza)' /tmp/npm-pack.txt; then
            echo "::error::npm pack appears to include secrets"
            exit 1
          fi
