appId: com.example.expomapsnavigation
---
# Sustained off-route after grace → catch brief rerouting-status → recover.
# Poll for chip immediately after each GPS fix (no long gaps).
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "Start Live GPS Navigation"
    timeout: 90000
- setLocation:
    latitude: 30.699239
    longitude: 76.6905161
- tapOn: "Start Live GPS Navigation"
- extendedWaitUntil:
    visible:
      id: "navigation-view"
    timeout: 60000
- assertVisible:
    id: "maneuver-banner"
# Burn past REROUTE_STARTUP_GRACE_MS (~16s) with shorter swipes (long ones crash XCTest)
- setLocation:
    latitude: 30.701982
    longitude: 76.693183
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
# Walk west off corridor
- setLocation:
    latitude: 30.701982
    longitude: 76.6920
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.701982
    longitude: 76.6905
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.701982
    longitude: 76.6890
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- evalScript: ${output.sawRerouteChip = false}
# Dwell off-route; check chip after every fix (chip stays ≥2s)
- repeat:
    times: 12
    commands:
      - setLocation:
          latitude: 30.7020
          longitude: 76.6870
      - runFlow:
          when:
            visible:
              id: "rerouting-status"
          commands:
            - evalScript: ${output.sawRerouteChip = true}
            - takeScreenshot: live-rerouting-status
      - setLocation:
          latitude: 30.7022
          longitude: 76.6867
      - runFlow:
          when:
            visible:
              id: "rerouting-status"
          commands:
            - evalScript: ${output.sawRerouteChip = true}
            - takeScreenshot: live-rerouting-status
      - swipe:
          start: 50%, 4%
          end: 50%, 4%
          duration: 400
- assertTrue: ${output.sawRerouteChip}
- extendedWaitUntil:
    notVisible:
      id: "rerouting-status"
    timeout: 60000
    optional: true
- setLocation:
    latitude: 30.704476
    longitude: 76.690653
- setLocation:
    latitude: 30.7075
    longitude: 76.694
- assertVisible:
    id: "navigation-view"
- assertVisible:
    id: "maneuver-banner"
- takeScreenshot: live-reroute-recovered
- tapOn:
    id: "cancel-navigation"
- extendedWaitUntil:
    visible: "Start Navigation"
    timeout: 30000
