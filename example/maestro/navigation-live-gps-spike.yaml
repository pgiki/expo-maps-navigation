appId: com.example.expomapsnavigation
---
# GPS spike must NOT auto-reroute: burn 15s grace, brief off, back on.
# Assert rerouting-status stays not visible (spike < confirm window).
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "Start Live GPS Navigation"
    timeout: 90000
- setLocation:
    latitude: 30.699239
    longitude: 76.6905161
- tapOn: "Start Live GPS Navigation"
- extendedWaitUntil:
    visible:
      id: "navigation-view"
    timeout: 60000
- assertVisible:
    id: "maneuver-banner"
- assertVisible:
    id: "trip-progress"
# Burn past REROUTE_STARTUP_GRACE_MS (~16s) with shorter swipes
- setLocation:
    latitude: 30.701982
    longitude: 76.693183
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 4000
- assertNotVisible:
    id: "rerouting-status"
# Brief spike west, then immediately back (< OFF_ROUTE_MIN_DURATION_MS)
- setLocation:
    latitude: 30.701982
    longitude: 76.6910
- setLocation:
    latitude: 30.701982
    longitude: 76.6895
- setLocation:
    latitude: 30.701982
    longitude: 76.693183
- takeScreenshot: live-gps-spike-recovered
- assertNotVisible:
    id: "rerouting-status"
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 3000
- assertNotVisible:
    id: "rerouting-status"
- assertVisible:
    id: "maneuver-banner"
- assertVisible:
    id: "trip-progress"
- takeScreenshot: live-gps-spike-no-reroute
- tapOn:
    id: "cancel-navigation"
- extendedWaitUntil:
    visible: "Start Navigation"
    timeout: 30000
