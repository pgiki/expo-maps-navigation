appId: com.example.expomapsnavigation
---
# Live GPS arrive: step setLocation along corridor (no Maestro travel — too slow).
# Dense fixes near dest so the live smoother can confirm arrive streak.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "Start Live GPS Navigation"
    timeout: 90000
- setLocation:
    latitude: 30.699239
    longitude: 76.6905161
- tapOn: "Start Live GPS Navigation"
- extendedWaitUntil:
    visible:
      id: "navigation-view"
    timeout: 60000
- assertVisible:
    id: "maneuver-banner"
- assertVisible:
    id: "trip-progress"
# Corridor hops
- setLocation:
    latitude: 30.701982
    longitude: 76.693183
- setLocation:
    latitude: 30.704476
    longitude: 76.690653
- setLocation:
    latitude: 30.7075
    longitude: 76.694
- setLocation:
    latitude: 30.7085
    longitude: 76.695
# Approach dest then jitter slightly so iOS watchPosition keeps firing
# (stationary fixes may not re-deliver; need ARRIVE_CONSECUTIVE=3).
- setLocation:
    latitude: 30.7088
    longitude: 76.6952
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.7090
    longitude: 76.6954
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.70915
    longitude: 76.69555
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.709241
    longitude: 76.695669
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.709245
    longitude: 76.695672
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.709238
    longitude: 76.695665
- swipe:
    start: 50%, 4%
    end: 50%, 4%
    duration: 500
- setLocation:
    latitude: 30.709241
    longitude: 76.695669
# Keep feeding tiny jitters until end-of-route (iOS may idle the watch)
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            notVisible:
              id: "end-of-route"
          commands:
            - setLocation:
                latitude: 30.709241
                longitude: 76.695669
            - swipe:
                start: 50%, 4%
                end: 50%, 4%
                duration: 350
            - setLocation:
                latitude: 30.709248
                longitude: 76.695675
            - swipe:
                start: 50%, 4%
                end: 50%, 4%
                duration: 350
- extendedWaitUntil:
    visible:
      id: "end-of-route"
    timeout: 20000
- assertVisible: "You have arrived"
- takeScreenshot: live-arrive-confirmed
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Start Navigation"
    timeout: 30000
- assertVisible:
    id: "home-screen"
- assertNotVisible:
    id: "navigation-view"
